# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-plfluidic"
BBFILE_PATTERN_meta-plfluidic = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-plfluidic = "10"

LAYERDEPENDS_meta-plfluidic = " \
    core \
    openembedded-layer \
    networking-layer \
    raspberrypi \
    webkit \
"

LAYERSERIES_COMPAT_meta-plfluidic = "scarthgap"
