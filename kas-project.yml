header:
  version: 14

machine: raspberrypi4-64
distro: plgraphic
target: plfluidic-rpi

repos:
  poky:
    url: https://git.yoctoproject.org/git/poky
    branch: scarthgap
    layers:
      meta:
      meta-poky:
      meta-yocto-bsp:

  meta-openembedded:
    url: https://git.openembedded.org/meta-openembedded
    branch: scarthgap
    layers:
      meta-oe:
      meta-python:
      meta-networking:
      meta-multimedia:

  meta-raspberrypi:
    url: https://git.yoctoproject.org/git/meta-raspberrypi
    branch: scarthgap
    layers:
      .:

  meta-tailscale:
    url: https://github.com/ChristophHandschuh/meta-tailscale
    branch: master
    layers:
      .:

  meta-wayland:
    url: https://codeberg.org/flk/meta-wayland
    branch: scarthgap
    layers:
      .:

  meta-webkit:
    url: https://github.com/Igalia/meta-webkit
    branch: scarthgap
    layers:
      .:
    
  meta-plfluidic:
    path: meta-plfluidic
  
local_conf_header:
  main: |
    # Optional network credentials
    TS_AUTH_KEY = "tskey-auth-abc-abc"
    WIFI_SSID = "abc"
    WIFI_PASS = "abc"

    # Image configuration
    IMAGE_FSTYPES:append = " wic.gz"
    IMAGE_BOOT_FILES:append = " ${KERNEL_IMAGETYPE}"
    USER_CLASSES ?= "buildstats"
    PATCHRESOLVE = "noop"

    BB_DISKMON_DIRS ??= "\
        STOPTASKS,${TMPDIR},1G,100K \
        STOPTASKS,${DL_DIR},1G,100K \
        STOPTASKS,${SSTATE_DIR},1G,100K \
        STOPTASKS,/tmp,100M,100K \
        HALT,${TMPDIR},100M,1K \
        HALT,${DL_DIR},100M,1K \
        HALT,${SSTATE_DIR},100M,1K \
        HALT,/tmp,10M,1K"

    CONF_VERSION = "2"
